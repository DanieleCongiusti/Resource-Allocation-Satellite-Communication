[General]
network = System
sim-time-limit = 1.6s

cmdenv-express-mode = false
cmdenv-event-banners = false

# Default Configuration 
**.N = 2						# Number of Terminals (defined in System.ned)
**.K = 100

num-rngs = 2					# Create a n° of Random-Number-Generator Streams as many as the Terminals

*.t[*].a = 10000KiB						# Min Size (bytes)
*.t[*].b = 100000KiB						# Max Size (bytes)	-> to provide a better interval of (a, b), check the Greatest and Lowest 
										#						cases from the table values for 'M' in the Specifics
 
*.t[*].mean_T = 0.025s					# mean value of T -> 	Considered a third of the Time-Frame's duration (80/3 ms) 
										#						to also provide the chance of NO packets in the queue of a terminal  

*.t[*].rng-0 = index			# *rng-0* 	: refers to the RNG of t[*] who's index specified (third argument) is '0'  
								# index 	: is a keyword which refers to the t[*] index (i.e. for terminal t[1], this line can be translated as: *.t[1].rng-0 = 1  
*.t[*].rng-1 = index
*.t[*].rng-2 = index

[Config throughputConsistencyTest]
repeat = 30
seed-set = ${repetition}

output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca

**.N = ${N = 2, 4, 8, 16, 32}
num-rngs = ${N}
**.K = 100
*.t[*].mean_T = 0.016s
*.t[*].a = 4B
*.t[*].b = 100B

[Config queueLengthConsistencyTest]
repeat = 30
seed-set = ${repetition}

output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca

**.N = 18
num-rngs = 18
**.K = 1
*.t[*].mean_T = ${T = 0.016s, 0.008s, 0.004s, 0.002s, 0.001s}
*.t[*].a = 4B
*.t[*].b = 100B


[Config degeneracyTest]
output-scalar-file = ${resultdir}/${configname}/degeneracy.sca
**.N = 0
**.K = 0
*.t[*].mean_T = 0s
*.t[*].a = 10^6
*.t[*].b = 10^7

[Config throughputContinuityTest]
repeat = 30
seed-set = ${repetition}

output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca

**.N = ${N = 2, 3, 4, 5, 6}
num-rngs = ${N}
**.K = 100
*.t[*].mean_T = 0.016s
*.t[*].a = 4B
*.t[*].b = 100B

[Config queueLengthContinuityTest]
repeat = 30
seed-set = ${repetition}

output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca

**.N = 18
num-rngs = 18
**.K = 1
*.t[*].mean_T = ${T = 0.016s, 0.015s, 0.014s, 0.013s, 0.012s}
*.t[*].a = 4B
*.t[*].b = 100B

[Config warmupTest]
repeat = 10
seed-set = ${repetition}
sim-time-limit = 8s

output-vector-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.vec
output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca

**.N = ${N = 8, 16, 24, 32, 48}
num-rngs = ${N}
**.K = ${K = 10, 20, 50, 100, 1000}
*.t[*].a = 4B
*.t[*].b = 100B